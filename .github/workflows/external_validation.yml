name: AGOS 4.1 External Security Validation

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  validate:
    name: Zero-Trust Security & Red-Team Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-test.txt

      - name: Run AGOS 4.1 External Validation Runner
        env:
          AGOS_PROVENANCE_SECRET: ${{ secrets.AGOS_PROVENANCE_SECRET || 'agos-4-1-github-actions-secret-minimum-32b!' }}
        run: |
          python run_validation.py

      - name: Archive validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agos-validation-result
          path: EXTERNAL_VALIDATION_RESULT.json
